# Compose de production, copié sur l'EC2 par le job deploy.
# Toutes les valeurs (tag de l'image, port, secrets) viennent du .env
# écrit sur le serveur par la CI : rien de sensible dans ce fichier.
name: fretly-etu01

services:
  api:
    image: ghcr.io/enzocohen/fretly-etu01:${IMAGE_TAG:?tag sha-... obligatoire}
    env_file: .env
    ports:
      - "${APP_PORT:?port obligatoire}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  db:
    image: postgres:17.6-alpine3.22
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
