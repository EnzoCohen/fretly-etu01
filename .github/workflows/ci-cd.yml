name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Sur une PR, un nouveau commit annule l'exécution en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=junit.xml --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-python-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  scan-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy fs (bloquant sur HIGH/CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  build:
    needs: [lint, test, scan-repo]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image (bloquant sur HIGH/CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # Publication de l'image scannée, jamais sur une Pull Request
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sur ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}:${{ vars.APP_PORT }}/docs
    permissions:
      contents: read
      packages: read
    # Jamais deux déploiements en même temps, et on n'en coupe pas un en cours
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configuration SSH (empreinte du serveur vérifiée)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host ec2
            HostName ${{ vars.EC2_HOST }}
            User ${{ vars.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CONF

      - name: Copie du fichier Compose
        run: scp deploy/compose.prod.yaml ec2:fretly/compose.yaml

      - name: Écriture du .env (lisible par etu01 uniquement)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          ssh ec2 'umask 077 && cat > fretly/.env && chmod 600 fretly/.env' <<ENV
          IMAGE_TAG=$IMAGE_TAG
          APP_PORT=$APP_PORT
          APP_ENV=production
          API_KEY=$API_KEY
          POSTGRES_USER=fretly
          POSTGRES_DB=fretly
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql+psycopg://fretly:$POSTGRES_PASSWORD@db:5432/fretly
          ENV

      - name: Connexion à ghcr.io depuis le serveur
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"

      - name: Pull de l'image
        run: ssh ec2 'cd fretly && docker compose -p fretly-etu01 pull'

      - name: Démarrage (attend que les healthchecks soient verts)
        run: ssh ec2 'cd fretly && docker compose -p fretly-etu01 up -d --wait --wait-timeout 120 --remove-orphans'

      - name: Déconnexion de ghcr.io
        if: always()
        run: ssh ec2 'docker logout ghcr.io' || true

      - name: Smoke test
        env:
          URL: http://${{ vars.EC2_HOST }}:${{ vars.APP_PORT }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/health"
          echo
          commit=$(curl -fsS "$URL/version" | jq -r .commit)
          echo "commit servi : $commit / attendu : $GITHUB_SHA"
          test "$commit" = "$GITHUB_SHA"
